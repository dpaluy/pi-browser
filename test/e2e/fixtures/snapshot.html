<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Snapshot workshop</title></head>
<body>
  <h1>Snapshot workshop</h1>
  <div><div><a href="/controls.html">Return to controls</a></div></div>
  <label>Reply address <input type="email" value="team@example.test" required></label>
  <label><input type="checkbox" checked> Receive updates</label>
  <button aria-pressed="true" disabled>Pin notice</button>
  <div id="shadow"></div>
  <iframe title="Local preview" src="/frame.html"></iframe>
  <iframe title="External preview" id="external"></iframe>
  <script>
    document.querySelector('#shadow').attachShadow({mode: 'open'}).innerHTML = '<button>Shadow action</button>';
    document.querySelector('#external').src = `http://frame.test:${location.port}/private.html`;
  </script>
</body>
</html>
